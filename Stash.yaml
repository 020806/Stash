# EdgeTunnel 2.1 + SUBAPI 极简 Stash 模板 (全美节点专供优化版)
# 适用：iPhone / Stash
# 优化点：
# 1. 彻底去除 Google/YouTube/海外服务等无意义的独立策略组，降低资源消耗。
# 2. 保留 AI 专区，规避节点频繁变动触发的 AI 风控。
# 3. 苹果服务默认直连，走国内 CDN 加速且节省流量。

mode: rule
log-level: info

dns:
  enable: true
  use-hosts: true
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 114.114.114.114
  nameserver:
    - https://sm2.doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  fallback:
    - 8.8.4.4
    - 208.67.220.220
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4
      - 127.0.0.1/32
      - 0.0.0.0/32
    domain:
      - '+.google.com'
      - '+.youtube.com'
      - '+.openai.com'
      - '+.anthropic.com'

# ==========================================
# 策略组架构 (精简为 4 个核心组)
# ==========================================
proxy-groups:
  # 1. 主选择器：手动切换默认节点，或选择“自动选择”
  - name: 🔰 节点选择
    type: select
    proxies:
      - ♻️ 自动选择
      - DIRECT
    include-all: true

  # 2. 自动选优：后台自动监测并切换至延迟最低的美国节点
  - name: ♻️ 自动选择
    type: url-test
    interval: 300
    lazy: true
    include-all: true

  # 3. AI 服务专区：建议在 Stash 中手动固定至某一个稳定节点，防止风控
  - name: 🤖 AI
    type: select
    proxies:
      - 🔰 节点选择
      - ♻️ 自动选择
      - DIRECT

  # 4. 苹果服务：默认走 DIRECT 直连，跑满国内 CDN 速度
  - name: 🍎 Apple
    type: select
    proxies:
      - DIRECT
      - 🔰 节点选择

# ==========================================
# 分流规则
# ==========================================
rules:
  # --- 局域网 / 保留地址 ---
  - DOMAIN-SUFFIX,local,DIRECT
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
  - IP-CIDR6,::1/128,DIRECT,no-resolve
  - IP-CIDR6,fc00::/7,DIRECT,no-resolve
  - IP-CIDR6,fe80::/10,DIRECT,no-resolve

  # --- AI 平台分流（最高优先级） ---
  - DOMAIN-SUFFIX,openai.com,🤖 AI
  - DOMAIN-SUFFIX,chatgpt.com,🤖 AI
  - DOMAIN-SUFFIX,chat.openai.com,🤖 AI
  - DOMAIN-SUFFIX,auth.openai.com,🤖 AI
  - DOMAIN-SUFFIX,oaistatic.com,🤖 AI
  - DOMAIN-SUFFIX,oaiusercontent.com,🤖 AI
  - DOMAIN-SUFFIX,anthropic.com,🤖 AI
  - DOMAIN-SUFFIX,claude.ai,🤖 AI
  - DOMAIN-SUFFIX,claude.com,🤖 AI
  - DOMAIN-SUFFIX,gemini.google.com,🤖 AI
  - DOMAIN-SUFFIX,generativelanguage.googleapis.com,🤖 AI
  - DOMAIN-SUFFIX,aistudio.google.com,🤖 AI
  - DOMAIN-SUFFIX,ai.google.dev,🤖 AI
  - DOMAIN-SUFFIX,bard.google.com,🤖 AI
  - DOMAIN-SUFFIX,deepseek.com,🤖 AI
  - DOMAIN-SUFFIX,perplexity.ai,🤖 AI
  - DOMAIN-SUFFIX,perplexity.com,🤖 AI
  - DOMAIN-SUFFIX,poe.com,🤖 AI
  - DOMAIN-SUFFIX,grok.com,🤖 AI
  - DOMAIN-SUFFIX,x.ai,🤖 AI
  - DOMAIN-SUFFIX,mistral.ai,🤖 AI
  - DOMAIN-SUFFIX,copilot.microsoft.com,🤖 AI
  - DOMAIN-SUFFIX,huggingface.co,🤖 AI
  - DOMAIN-SUFFIX,hf.co,🤖 AI
  - DOMAIN-SUFFIX,replicate.com,🤖 AI

  # --- 苹果服务分流 ---
  - DOMAIN-SUFFIX,apple.com,🍎 Apple
  - DOMAIN-SUFFIX,icloud.com,🍎 Apple
  - DOMAIN-SUFFIX,icloud-content.com,🍎 Apple
  - DOMAIN-SUFFIX,me.com,🍎 Apple
  - DOMAIN-SUFFIX,cdn-apple.com,🍎 Apple
  - DOMAIN-SUFFIX,apple-cloudkit.com,🍎 Apple
  - DOMAIN-SUFFIX,apple-dns.net,🍎 Apple
  - DOMAIN-SUFFIX,mzstatic.com,🍎 Apple

  # --- 中国大陆 IP 直连 ---
  - GEOIP,CN,DIRECT

  # --- 其他剩余流量（Google、YouTube、Telegram 等全部自动走节点） ---
  - MATCH,🔰 节点选择
