# EdgeTunnel 2.1 + SUBAPI 最终精简 Stash 模板
# 适用：iPhone / Stash
# 设计目标：
# 1. 不裁剪订阅节点；通过 include-all 自动接收后续新增/失效节点
# 2. 节点只在「🔰 节点选择」「♻️ 自动选择」中直接收纳，避免重复展开
# 3. AI、YouTube、Google、海外常用服务、Apple 分开分流
# 4. 不包含 Netflix、Disney+ 等付费视频流媒体专用规则
# 5. 不把原配置约 8869 条广告规则塞入主配置，避免再次膨胀
mode: rule
log-level: info

dns:
  enable: true
  use-hosts: true
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 114.114.114.114
  nameserver:
    - https://sm2.doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  fallback:
    - 8.8.4.4
    - 208.67.220.220
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4
      - 127.0.0.1/32
      - 0.0.0.0/32
    domain:
      - '+.google.com'
      - '+.youtube.com'
      - '+.openai.com'
      - '+.anthropic.com'

proxy-groups:
  - name: 🔰 节点选择
    type: select
    proxies:
      - ♻️ 自动选择
      - DIRECT
    include-all: true

  - name: ♻️ 自动选择
    type: url-test
    interval: 300
    lazy: true
    include-all: true

  - name: 🤖 AI
    type: select
    proxies:
      - 🔰 节点选择
      - ♻️ 自动选择
      - DIRECT

  - name: ▶️ YouTube
    type: select
    proxies:
      - 🔰 节点选择
      - ♻️ 自动选择
      - DIRECT

  - name: 🌐 Google
    type: select
    proxies:
      - 🔰 节点选择
      - ♻️ 自动选择
      - DIRECT

  - name: 🌍 海外服务
    type: select
    proxies:
      - 🔰 节点选择
      - ♻️ 自动选择
      - DIRECT

  - name: 🍎 Apple
    type: select
    proxies:
      - 🔰 节点选择
      - ♻️ 自动选择
      - DIRECT

rules:
  # 局域网 / 保留地址
  - DOMAIN-SUFFIX,local,DIRECT
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
  - IP-CIDR6,::1/128,DIRECT,no-resolve
  - IP-CIDR6,fc00::/7,DIRECT,no-resolve
  - IP-CIDR6,fe80::/10,DIRECT,no-resolve

  # AI：优先于 Google
