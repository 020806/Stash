[custom]

enable_rule_generator=true
overwrite_original_rules=true

# 最新版 v4：Siri AI（最优先）+ 支付宝 / 微信小程序 + 你手机在用的国内 App + iRingo 天气
# 相对 v3 的改动（都要改，不只是注释）：
# 1. Siri AI 一行没动，仍是最高优先级，🤖 AI 手动固定非中国、支持地区的稳定节点。
#    唯一新增：Gemini 也进了 🤖 AI（见第 1 节末尾），它和 Siri / ChatGPT 一样怕中途换 IP。
# 2. 新增「支付 / 金融直连」（第 3 节）：支付宝小程序、微信小程序 / 微信支付、
#    建设 / 邮储 / 中国 / 农业 / 招商银行、云闪付、联通。
#    支付宝小程序无网络就是这段漏了：小程序代码包走 alipayobjects.com，
#    接口走 alipay.com / alipay.cn，风控一看到境外 IP 就直接拒，
#    之前只靠 GEOSITE,alibaba 兜不全，显式写出来才稳。
#    小程序里第三方服务商自己的域名，通常是国内 IP，靠下面 GEOIP,CN 兜底。
# 3. 国内 DIRECT 按你 2026-11-14 发的 iPhone 储存截图补齐：
#    微信、QQ、小红书、拼多多、美团、12306、酷狗、哔哩哔哩、网易云游戏、
#    什么值得买、识货、小黑盒、扇贝、炭炭背单词、抖音、淘宝、京东、酷安、天猫。
#    苹果系统 App（照片、音乐、健康、地图、天气、邮件、备忘录等）不单独列，
#    它们走最后 MATCH 自动选择即可，不用直连。
# 4. 其余不变：iRingo、酷安广告、MATCH 走 ♻️ 自动选择（300 秒测速，超时自动换节点）。

# ==========================================
# 1. 策略组：只留 3 个
# ==========================================
custom_proxy_group=🔰 节点选择`select`.*
custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`300,,100
# 🤖 AI 是 select 组，里面可以手动选 🔰 节点选择或 ♻️ 自动选择。
# 推荐：手动固定一个非中国、支持地区的稳定节点（不一定是美国）。
# 不推荐在 AI 里长期挂自动选择：自动换 IP 会断 Siri 的 PCC 会话。
# 手动换节点 / 换配置文件后重开是没问题的。
custom_proxy_group=🤖 AI`select`[]🔰 节点选择`[]♻️ 自动选择

# ==========================================
# 2. 分流规则（顺序就是优先级）
# ==========================================

# --- 1. Siri / Apple Intelligence（最优先）---
# 只留苹果官方 PCC 核心 + ChatGPT 扩展 + Gemini。
# mask / Private Relay、probe、ls.apple.com 等不走 DIRECT、走代理就没事，
# 不用单独占一行；seed.siri / api-siri-prod 已被 siri 后缀和关键字覆盖。
ruleset=🤖 AI,[]DOMAIN,guzzoni.apple.com
ruleset=🤖 AI,[]DOMAIN-SUFFIX,smoot.apple.com
ruleset=🤖 AI,[]DOMAIN-SUFFIX,siri.apple.com
ruleset=🤖 AI,[]DOMAIN-SUFFIX,pcc.apple.com
ruleset=🤖 AI,[]DOMAIN-SUFFIX,apple-intelligence.com
ruleset=🤖 AI,[]DOMAIN-SUFFIX,apple-cloudkit.com
ruleset=🤖 AI,[]DOMAIN-SUFFIX,apple-relay.apple.com
ruleset=🤖 AI,[]DOMAIN-SUFFIX,apple-relay.cloudflare.com
ruleset=🤖 AI,[]DOMAIN-SUFFIX,apple-relay.fastly-edge.com
ruleset=🤖 AI,[]DOMAIN-SUFFIX,cp4.cloudflare.com
ruleset=🤖 AI,[]DOMAIN-SUFFIX,cl4.apple.com
ruleset=🤖 AI,[]DOMAIN-SUFFIX,cl5.apple.com
ruleset=🤖 AI,[]DOMAIN,gspe1-ssl.ls.apple.com
ruleset=🤖 AI,[]DOMAIN-SUFFIX,gateway.icloud.com
ruleset=🤖 AI,[]DOMAIN-KEYWORD,apple-intelligence
ruleset=🤖 AI,[]DOMAIN-KEYWORD,siri
ruleset=🤖 AI,[]DOMAIN-SUFFIX,chatgpt.com
ruleset=🤖 AI,[]DOMAIN-SUFFIX,openai.com
ruleset=🤖 AI,[]DOMAIN-SUFFIX,oaistatic.com
ruleset=🤖 AI,[]DOMAIN-SUFFIX,oaiusercontent.com
# Gemini：和 Siri / ChatGPT 一样怕中途换 IP，走 AI 组固定节点比走自动选择稳
ruleset=🤖 AI,[]DOMAIN-SUFFIX,gemini.google.com
ruleset=🤖 AI,[]DOMAIN-SUFFIX,generativelanguage.googleapis.com
ruleset=🤖 AI,[]DOMAIN-SUFFIX,ai.google.dev

# --- 2. iRingo 天气 ---
# 阻断 QUIC，强制走 TCP，保证 MitM 重写生效
ruleset=REJECT,[]AND,((DOMAIN,weatherkit.apple.com),(NETWORK,UDP))
# 阻断天气遥测
ruleset=REJECT,[]DOMAIN,weather-analytics-events.apple.com
ruleset=REJECT,[]DOMAIN,tether.edge.apple
ruleset=REJECT,[]DOMAIN-SUFFIX,tthr.apple.com
# 云端后端
ruleset=♻️ 自动选择,[]DOMAIN-SUFFIX,weatherkit.pages.dev
# 天气数据源
ruleset=DIRECT,[]DOMAIN,weatherkit.apple.com
ruleset=DIRECT,[]DOMAIN,weather-data.apple.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,weather.apple.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,caiyunapp.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,qweather.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,heweather.net

# --- 3. 支付 / 金融直连（最严格，放在其他国内 App 之前）---
# 支付宝小程序：代码包 + 接口 + 蚂蚁 / 网商银行，漏一个都可能白屏 / 无网络
ruleset=DIRECT,[]DOMAIN-SUFFIX,alipay.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,alipayobjects.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,alipay.cn
ruleset=DIRECT,[]DOMAIN-SUFFIX,antgroup.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,antfin.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,mybank.cn
ruleset=DIRECT,[]DOMAIN-SUFFIX,antfortune.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,zhifubao.com
ruleset=DIRECT,[]DOMAIN-KEYWORD,alipay
# 微信小程序 / 微信支付：小程序代码包 + 接口
ruleset=DIRECT,[]DOMAIN-SUFFIX,weixin.qq.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,wx.qq.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,wechat.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,servicewechat.com
# 银行：建设、邮储、中国、农业、招商，全部直连，境外 IP 容易触发风控 / 登录失败
ruleset=DIRECT,[]DOMAIN-SUFFIX,ccb.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,psbc.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,boc.cn
ruleset=DIRECT,[]DOMAIN-SUFFIX,abchina.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,cmbchina.com
# 云闪付 / 银联
ruleset=DIRECT,[]DOMAIN-SUFFIX,unionpay.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,95516.com
# 中国联通
ruleset=DIRECT,[]DOMAIN-SUFFIX,unicom.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,chinaunicom.cn
ruleset=DIRECT,[]DOMAIN-SUFFIX,10010.com
# 数字人民币、住理生活、小蚕惠生活没有公开主域名可列，靠下面 GEOSITE,cn + GEOIP,CN 兜底

# --- 4. 酷安广告（必须在酷安 DIRECT 之前）---
ruleset=REJECT,[]DOMAIN-SUFFIX,ad.coolapk.com
ruleset=REJECT,[]DOMAIN-SUFFIX,sponsor.coolapk.com

# --- 5. 国内 App 直连（按你手机实际在用的）---
# 社交 / 内容：微信、QQ 主域名在上面第 3 节和下面 GEOSITE,tencent 里，
# 这里只补图片 / CDN 和小红书、微博
ruleset=DIRECT,[]DOMAIN-SUFFIX,qlogo.cn
ruleset=DIRECT,[]DOMAIN-SUFFIX,gtimg.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,xiaohongshu.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,xhs.cn
ruleset=DIRECT,[]DOMAIN-SUFFIX,xhscdn.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,weibo.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,weibo.cn
ruleset=DIRECT,[]DOMAIN-SUFFIX,sinaimg.cn
# 购物：淘宝 / 天猫 / 京东的图片 CDN + 拼多多、美团、什么值得买、识货
ruleset=DIRECT,[]DOMAIN-SUFFIX,alicdn.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,tbcdn.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,tbcdn.cn
ruleset=DIRECT,[]DOMAIN-SUFFIX,aliimg.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,aliyuncs.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,tmall.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,tmall.hk
ruleset=DIRECT,[]DOMAIN-SUFFIX,360buyimg.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,jdcdn.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,pinduoduo.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,pddpic.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,yangkeduo.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,meituan.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,meituan.net
ruleset=DIRECT,[]DOMAIN-SUFFIX,sankuai.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,dpfile.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,smzdm.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,shihuo.cn
# 抖音 / 酷安图片 CDN（抖省省也是字节系，走下面 GEOSITE,bytedance）
ruleset=DIRECT,[]DOMAIN-SUFFIX,douyinpic.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,byteimg.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,ibyteimg.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,pstatp.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,douyincdn.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,snssdk.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,coolapk.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,coolapk-static.com
# 出行：12306
ruleset=DIRECT,[]DOMAIN-SUFFIX,12306.cn
# 影音 / 游戏 / 学习：酷狗、哔哩哔哩、网易云游戏、扇贝、小黑盒
ruleset=DIRECT,[]DOMAIN-SUFFIX,kugou.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,kugou.cn
ruleset=DIRECT,[]DOMAIN-SUFFIX,kgimg.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,bilibili.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,bilibili.cn
ruleset=DIRECT,[]DOMAIN-SUFFIX,bilivideo.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,hdslb.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,163.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,netease.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,shanbay.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,heybox.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,xiaoheibox.com
# 几个大厂主站 + 旗下 App 交给 GEOSITE，显式域名是防 GEOSITE 漏掉的 CDN
ruleset=DIRECT,[]GEOSITE,bytedance
ruleset=DIRECT,[]GEOSITE,alibaba
ruleset=DIRECT,[]GEOSITE,jd
ruleset=DIRECT,[]GEOSITE,tencent
ruleset=DIRECT,[]GEOSITE,netease
ruleset=DIRECT,[]GEOSITE,baidu
ruleset=DIRECT,[]GEOSITE,bilibili
ruleset=DIRECT,[]GEOSITE,cn

# --- 6. 国内兜底 + 兜底代理 ---
# DOMAIN-SUFFIX,cn：所有 .cn 域名直连，fake-ip 下也有效
# GEOIP,CN：IP 直连的 App、硬编码 IP 的连接、以及小程序里第三方服务商的国内服务器靠它兜底
ruleset=DIRECT,[]DOMAIN-SUFFIX,cn
ruleset=DIRECT,[]GEOIP,CN,no-resolve
ruleset=DIRECT,[]GEOIP,PRIVATE,no-resolve
# 兜底走 ♻️ 自动选择，不是 🔰 节点选择：
# 手动选的节点超时也不会自动换，只有 url-test 会自动换最快节点
ruleset=♻️ 自动选择,[]MATCH
