[custom]

enable_rule_generator=true
overwrite_original_rules=true

# ==========================================
# 说明：这是 Lewis 原文件的优化版，只改 subconverter 自定义部分
# 核心思路：
# 1. AI 最优先、且绝不能走 DIRECT / 自动切换节点
# 2. 国内 App 图片/CDN 必须在 MATCH 代理之前全部 DIRECT，
#    漏一个域名就会走海外节点 + QUIC 失败 = 偶尔无网、评论图转圈
# 3. 兜底用域名 (.cn / GEOSITE,cn) + IP (GEOIP,CN,no-resolve) 双保险，
#    因为 fake-ip 下 GEOIP,CN 对域名基本失效
# 注意：DNS / TUN / QUIC / MitM 不在这个 ini 里改，
#      在 Stash 主配置里按文末“主配置检查清单”核对
# ==========================================

# ==========================================
# 1. 策略组
# ==========================================
custom_proxy_group=🔰 节点选择`select`.*
custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`600,,100
# 改动：
# - 自动选择容差 50 -> 100ms，间隔 300 -> 600s，减少节点来回跳
#   节点一跳，Siri 的 PCC 会话和淘宝/抖音的登录态就容易断
# - 🤖 AI 删除了 DIRECT：AI 走 DIRECT = 直接暴露中国 IP，
#   苹果会判定不可用，且可能要重启手机才能恢复
# - 🤖 AI 不要用自动选择，手动固定一个美国干净 IP 节点
#   自动选择一换 IP，Siri 就会报“Apple Intelligence 不可用”
# - 删除了 🍎 Apple 组：原文件里没有任何规则用它，是死组
custom_proxy_group=🤖 AI`select`[]🔰 节点选择`[]♻️ 自动选择

# ==========================================
# 2. 分流规则（顺序就是优先级，从上到下）
# ==========================================

# --- 0. 内网 / 私有 IP，永远直连，放最前面 ---
ruleset=DIRECT,[]IP-CIDR,127.0.0.0/8,no-resolve
ruleset=DIRECT,[]IP-CIDR,192.168.0.0/16,no-resolve
ruleset=DIRECT,[]IP-CIDR,10.0.0.0/8,no-resolve
ruleset=DIRECT,[]IP-CIDR,172.16.0.0/12,no-resolve

# --- 1. Siri / Apple Intelligence（最优先）---
# 依据：Apple 官方企业网络文档 support.apple.com/101555
# Private Cloud Compute：guzzoni / smoot / apple-relay.* / cp4
# 原文件缺的最关键几条已补上：
#   pcc.apple.com、apple-intelligence.com、apple-cloudkit.com、
#   cl4/cl5.apple.com（模型下载）、ChatGPT 扩展域名
#   apple-relay.akamaized.net、apple-carry-relay.cloudflare.com
# 删除：wps.apple.com（不是 AI 域名）
ruleset=🤖 AI,[]DOMAIN,guzzoni.apple.com
ruleset=🤖 AI,[]DOMAIN-SUFFIX,smoot.apple.com
ruleset=🤖 AI,[]DOMAIN-SUFFIX,siri.apple.com
ruleset=🤖 AI,[]DOMAIN,seed.siri.apple.com
ruleset=🤖 AI,[]DOMAIN,api-siri-prod.apple.com
ruleset=🤖 AI,[]DOMAIN-SUFFIX,pcc.apple.com
ruleset=🤖 AI,[]DOMAIN-SUFFIX,apple-intelligence.com
ruleset=🤖 AI,[]DOMAIN-SUFFIX,apple-cloudkit.com
ruleset=🤖 AI,[]DOMAIN-SUFFIX,apple-cloudcompute.com
ruleset=🤖 AI,[]DOMAIN-SUFFIX,apple-ai.com
ruleset=🤖 AI,[]DOMAIN-SUFFIX,apple-relay.apple.com
ruleset=🤖 AI,[]DOMAIN-SUFFIX,apple-relay.cloudflare.com
ruleset=🤖 AI,[]DOMAIN-SUFFIX,apple-relay.fastly-edge.com
ruleset=🤖 AI,[]DOMAIN-SUFFIX,apple-relay.akamaized.net
ruleset=🤖 AI,[]DOMAIN-SUFFIX,apple-carry-relay.cloudflare.com
ruleset=🤖 AI,[]DOMAIN-SUFFIX,apple-relay.mask.apple-dns.net
ruleset=🤖 AI,[]DOMAIN-SUFFIX,cp4.cloudflare.com
ruleset=🤖 AI,[]DOMAIN-SUFFIX,cl4.apple.com
ruleset=🤖 AI,[]DOMAIN-SUFFIX,cl5.apple.com
ruleset=🤖 AI,[]DOMAIN,appldnld.apple.com
ruleset=🤖 AI,[]DOMAIN,mesu.apple.com
ruleset=🤖 AI,[]DOMAIN-SUFFIX,aaplimg.com
ruleset=🤖 AI,[]DOMAIN,gspe1-ssl.ls.apple.com
ruleset=🤖 AI,[]DOMAIN,gsa.apple.com
ruleset=🤖 AI,[]DOMAIN-SUFFIX,gateway.icloud.com
ruleset=🤖 AI,[]DOMAIN-SUFFIX,gateway.apple.com
ruleset=🤖 AI,[]DOMAIN-SUFFIX,ls.apple.com
ruleset=🤖 AI,[]DOMAIN-KEYWORD,apple-intelligence
ruleset=🤖 AI,[]DOMAIN-KEYWORD,apple-ml
ruleset=🤖 AI,[]DOMAIN-KEYWORD,siri
# ChatGPT 扩展（Siri 里用 ChatGPT 时走同一组，别走 DIRECT）
ruleset=🤖 AI,[]DOMAIN-SUFFIX,chatgpt.com
ruleset=🤖 AI,[]DOMAIN-SUFFIX,openai.com
ruleset=🤖 AI,[]DOMAIN-SUFFIX,oaistatic.com
ruleset=🤖 AI,[]DOMAIN-SUFFIX,oaiusercontent.com
# iCloud Private Relay / mask（只在你开了 Private Relay 时才有用，
# 不开也不影响，放 AI 组里是为了不让它走 DIRECT 暴露 IP）
ruleset=🤖 AI,[]DOMAIN,mask-api.fe.apple-dns.net
ruleset=🤖 AI,[]DOMAIN,mask-api.fe2.apple-dns.net
ruleset=🤖 AI,[]DOMAIN,mask-api.icloud.com
ruleset=🤖 AI,[]DOMAIN,mask-t.apple-dns.net
ruleset=🤖 AI,[]DOMAIN,mask.apple-dns.net
ruleset=🤖 AI,[]DOMAIN-SUFFIX,mask-h2.icloud.com
ruleset=🤖 AI,[]DOMAIN-SUFFIX,mask.icloud.com
ruleset=🤖 AI,[]DOMAIN,probe.icloud.com
ruleset=🤖 AI,[]DOMAIN,metrics.icloud.com

# --- 2. iRingo 天气（保持原样）---
# 阻断 QUIC，强制走 TCP，保证 MitM 重写生效
ruleset=REJECT,[]AND,((DOMAIN,weatherkit.apple.com),(NETWORK,UDP))
# 阻断天气遥测
ruleset=REJECT,[]DOMAIN,weather-analytics-events.apple.com
ruleset=REJECT,[]DOMAIN,tether.edge.apple
ruleset=REJECT,[]DOMAIN-SUFFIX,tthr.apple.com
# 云端后端
ruleset=🔰 节点选择,[]DOMAIN-SUFFIX,weatherkit.pages.dev
# 天气数据源
ruleset=DIRECT,[]DOMAIN,weatherkit.apple.com
ruleset=DIRECT,[]DOMAIN,weather-data.apple.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,weather.apple.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,caiyunapp.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,qweather.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,heweather.net

# --- 3. 酷安广告（必须在酷安 DIRECT 之前，否则会被
#     DOMAIN-SUFFIX,coolapk.com 直连规则先命中而失效）---
ruleset=REJECT,[]DOMAIN-SUFFIX,ad.coolapk.com
ruleset=REJECT,[]DOMAIN-SUFFIX,sponsor.coolapk.com

# --- 4. 国内 App 白名单直连 ---
# 原则：图片、CDN、头像、评论图域名一个都不能漏。
# 漏掉的域名会掉到最后的 MATCH 走代理，
# 海外节点 + 阿里/字节风控 + QUIC 不通 = 偶尔无网、评论图加载失败。
# 下面按“评论图/头像最容易漏的”补全，原有域名全部保留。

# 4.0 各 App 共用的头像 / CDN（评论区头像很多走这里）
ruleset=DIRECT,[]DOMAIN-SUFFIX,qlogo.cn
ruleset=DIRECT,[]DOMAIN-SUFFIX,qq.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,gtimg.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,gtimg.cn
ruleset=DIRECT,[]DOMAIN-SUFFIX,sinaimg.cn
ruleset=DIRECT,[]DOMAIN-SUFFIX,weibo.com

