[custom]

enable_rule_generator=true
overwrite_original_rules=true

# ==========================================
# 1. 策略组
# ==========================================
custom_proxy_group=🔰 节点选择`select`.*
custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🤖 AI`select`[]🔰 节点选择`[]♻️ 自动选择`[]DIRECT`.*
custom_proxy_group=🍎 Apple`select`[]DIRECT`[]🔰 节点选择`[]♻️ 自动选择

# ==========================================
# 2. 分流规则匹配
# ==========================================

# --- 0. Apple 天气优化 (已修正语法错误) ---
ruleset=REJECT,[]AND,(PROTOCOL,UDP),(DEST-PORT,443),(DOMAIN-KEYWORD,weather)
ruleset=DIRECT,[]DOMAIN,weather-data.apple.com
ruleset=DIRECT,[]DOMAIN,weatherkit.apple.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,weather.apple.com

# --- 1. AI 专区 ---
ruleset=🤖 AI,[]DOMAIN-SUFFIX,openai.com
ruleset=🤖 AI,[]DOMAIN-SUFFIX,chatgpt.com
ruleset=🤖 AI,[]DOMAIN-SUFFIX,chat.openai.com
ruleset=🤖 AI,[]DOMAIN-SUFFIX,auth.openai.com
ruleset=🤖 AI,[]DOMAIN-SUFFIX,oaistatic.com
ruleset=🤖 AI,[]DOMAIN-SUFFIX,oaiusercontent.com
ruleset=🤖 AI,[]DOMAIN-SUFFIX,anthropic.com
ruleset=🤖 AI,[]DOMAIN-SUFFIX,claude.ai
ruleset=🤖 AI,[]DOMAIN-SUFFIX,claude.com
ruleset=🤖 AI,[]DOMAIN-SUFFIX,gemini.google.com
ruleset=🤖 AI,[]DOMAIN-SUFFIX,generativelanguage.googleapis.com
ruleset=🤖 AI,[]DOMAIN-SUFFIX,aistudio.google.com
ruleset=🤖 AI,[]DOMAIN-SUFFIX,ai.google.dev
ruleset=🤖 AI,[]DOMAIN-SUFFIX,bard.google.com
ruleset=🤖 AI,[]DOMAIN-SUFFIX,deepseek.com
ruleset=🤖 AI,[]DOMAIN-SUFFIX,perplexity.ai
ruleset=🤖 AI,[]DOMAIN-SUFFIX,perplexity.com
ruleset=🤖 AI,[]DOMAIN-SUFFIX,poe.com
ruleset=🤖 AI,[]DOMAIN-SUFFIX,grok.com
ruleset=🤖 AI,[]DOMAIN-SUFFIX,x.ai
ruleset=🤖 AI,[]DOMAIN-SUFFIX,mistral.ai
ruleset=🤖 AI,[]DOMAIN-SUFFIX,copilot.microsoft.com
ruleset=🤖 AI,[]DOMAIN-SUFFIX,huggingface.co
ruleset=🤖 AI,[]DOMAIN-SUFFIX,hf.co
ruleset=🤖 AI,[]DOMAIN-SUFFIX,replicate.com

# --- 2. 苹果常规服务 ---
ruleset=🍎 Apple,[]DOMAIN-SUFFIX,apple.com
ruleset=🍎 Apple,[]DOMAIN-SUFFIX,icloud.com
ruleset=🍎 Apple,[]DOMAIN-SUFFIX,icloud-content.com
ruleset=🍎 Apple,[]DOMAIN-SUFFIX,me.com
ruleset=🍎 Apple,[]DOMAIN-SUFFIX,cdn-apple.com
ruleset=🍎 Apple,[]DOMAIN-SUFFIX,apple-cloudkit.com
ruleset=🍎 Apple,[]DOMAIN-SUFFIX,apple-dns.net
ruleset=🍎 Apple,[]DOMAIN-SUFFIX,mzstatic.com

# --- 3. 国内直连与兜底 ---
ruleset=DIRECT,[]GEOIP,CN
ruleset=🔰 节点选择,[]MATCH
