# --- 5. 国内兜底（域名 + IP 双保险，放 MATCH 之前）---
# 新增 DOMAIN-SUFFIX,cn：所有 .cn 域名直接走直连，
# 哪怕 GEOSITE,cn 列表没收录、哪怕 DNS 是 fake-ip，
# 域名规则依然能命中，不会掉到代理。
ruleset=DIRECT,[]DOMAIN-SUFFIX,cn
ruleset=DIRECT,[]GEOSITE,cn
# 加 no-resolve：IP 规则不触发 DNS 解析，
# 避免解析到海外 CDN IP 后误判，也更快
ruleset=DIRECT,[]GEOIP,CN,no-resolve
ruleset=DIRECT,[]GEOIP,PRIVATE,no-resolve
ruleset=🔰 节点选择,[]MATCH
