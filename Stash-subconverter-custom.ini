[custom]

enable_rule_generator=true
overwrite_original_rules=true

# ==========================================
# 1. 策略组
# ==========================================
custom_proxy_group=🔰 节点选择`select`.*
custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🤖 AI`select`[]🔰 节点选择`[]♻️ 自动选择`[]DIRECT`.*
custom_proxy_group=🍎 Apple`select`[]DIRECT`[]🔰 节点选择`[]♻️ 自动选择

# ==========================================
# 2. 分流规则 (最高优先级直连)
# ==========================================

# --- 1. 抖音/字节全系图片与评论区 CDN (强制直连) ---
ruleset=DIRECT,[]GEOSITE,bytedance
ruleset=DIRECT,[]DOMAIN-SUFFIX,byteimg.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,bytegecko.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,bytescm.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,bytednsdoc.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,pstatp.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,douyin.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,douyincdn.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,douyinpic.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,amemv.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,snssdk.com

# --- 2. 天气服务与数据 API 直连 ---
ruleset=DIRECT,[]DOMAIN,weatherkit.apple.com
ruleset=DIRECT,[]DOMAIN,weather-data.apple.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,weather.apple.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,weatherkit.pages.dev
ruleset=DIRECT,[]DOMAIN-SUFFIX,caiyunapp.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,qweather.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,heweather.net

# --- 3. AI 服务聚合组 ---
ruleset=🤖 AI,[]GEOSITE,openai
ruleset=🤖 AI,[]GEOSITE,anthropic
ruleset=🤖 AI,[]GEOSITE,google-gemini
ruleset=🤖 AI,[]GEOSITE,perplexity
ruleset=🤖 AI,[]GEOSITE,deepseek

# --- 4. 苹果服务聚合组 ---
ruleset=🍎 Apple,[]GEOSITE,apple

# --- 5. 国内网络与兜底 ---
ruleset=DIRECT,[]GEOIP,CN
ruleset=🔰 节点选择,[]MATCH
