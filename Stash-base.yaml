# Minimal Clash/Stash base used by subconverter
# Nodes, proxy-groups and rules are populated by the external INI configuration.
mode: rule
log-level: info

dns:
  enable: true
  use-hosts: true
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 114.114.114.114
  nameserver:
    - https://sm2.doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  fallback:
    - 8.8.4.4
    - 208.67.220.220
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4
      - 127.0.0.1/32
      - 0.0.0.0/32
    domain:
      - '+.google.com'
      - '+.youtube.com'
      - '+.openai.com'
      - '+.anthropic.com'
